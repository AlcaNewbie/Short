<!doctype html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AlcaShort — Pemendek Link Simpel &amp; Cepat</title>
  <meta name="description" content="AlcaShort: pendekkan link dengan alias custom. Simpel, cepat, gratis.">
  <meta name="theme-color" content="#0b0f14">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script>
    // Terapkan tema sebelum render agar tidak berkedip
    (function () {
      try {
        var saved = localStorage.getItem('alcashort-theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="nav">
    <a class="brand" href="/" aria-label="AlcaShort beranda">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="url(#g)"/><path d="M12.5 19.5l7-7M14 11.5l1.4-1.4a4 4 0 015.7 5.7L19.7 17M18 20.5l-1.4 1.4a4 4 0 01-5.7-5.7L12.3 14.8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><defs><linearGradient id="g" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs></svg>
      <span>Alca<b>Short</b></span>
    </a>
    <button id="themeToggle" class="icon-btn" type="button" aria-label="Ganti tema" title="Ganti tema">
      <svg class="i-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
    </button>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>Pendekkan link,<br><span class="grad">tanpa ribet.</span></h1>
      <p class="sub">Tempel link panjangmu, pilih alias sendiri, selesai. Cepat, bersih, tanpa iklan.</p>
    </section>

    <form id="form" class="card" novalidate autocomplete="off">
      <label for="url">Link tujuan</label>
      <input id="url" name="url" type="text" inputmode="url" placeholder="https://contoh.com/link-yang-sangat-panjang" required>

      <label for="alias">Alias custom <span class="opt">(opsional)</span></label>
      <div class="alias-row">
        <span class="prefix" id="prefix">alca.short/</span>
        <input id="alias" name="alias" type="text" placeholder="alcaganteng" maxlength="32" spellcheck="false">
      </div>
      <p class="hint">3–32 karakter: huruf, angka, <code>-</code> dan <code>_</code>. Kosongkan untuk alias acak.</p>

      <button id="submit" class="btn" type="submit">
        <span class="btn-label">Pendekkan</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>
      <p id="error" class="error" role="alert" hidden></p>
    </form>

    <section id="result" class="card result" hidden aria-live="polite">
      <p class="result-title">Link kamu siap 🎉</p>
      <div class="result-row">
        <a id="shortLink" href="#" target="_blank" rel="noopener"></a>
        <button id="copyBtn" class="btn small" type="button">Salin</button>
      </div>
      <p id="warn" class="warn" hidden></p>
    </section>

    <section id="historyBox" class="history" hidden>
      <div class="history-head">
        <h2>Riwayat di perangkat ini</h2>
        <button id="clearHistory" class="link-btn" type="button">Hapus riwayat</button>
      </div>
      <ul id="historyList"></ul>
    </section>
  </main>

  <footer class="foot">
    <span>© <span id="year"></span> AlcaShort</span>
    <span class="dot">•</span>
    <span>Credits: <b>AlcaW44</b></span>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
